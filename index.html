<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码保护 - 旅游攻略</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #90e0ef 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 16px;
  padding: 40px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
h1 {
  text-align: center;
  color: #0077b6;
  margin-bottom: 10px;
  font-size: 24px;
}
.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 14px;
}
input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}
input:focus {
  outline: none;
  border-color: #0077b6;
}
button {
  width: 100%;
  padding: 12px;
  background: #0077b6;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover {
  background: #005a8d;
}
.error {
  color: #d63031;
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  display: none;
}
.info {
  margin-top: 20px;
  padding: 12px;
  background: #f0f8ff;
  border-radius: 8px;
  font-size: 13px;
  color: #666;
  text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <h1>🔒 密码保护</h1>
  <p class="subtitle">请输入密码访问旅游攻略</p>
  <input type="password" id="password" placeholder="请输入密码" autofocus>
  <button onclick="checkPassword()">访问攻略</button>
  <div class="error" id="error">密码错误，请重试</div>
  <div class="info">
    💡 提示：密码由攻略作者提供
  </div>
</div>

<script>
// 密码验证
const correctHash = 'aeb6d4157c98e6b92d1ab7b95cd2d614743c55dbec009ce7e63cd35b9dda4e63';

function checkPassword() {
  const pwd = document.getElementById('password').value;
  
  // 简单的SHA256计算
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
  }
  
  sha256(pwd).then(hash => {
    if (hash === correctHash) {
      // 密码正确，跳转到真实页面
      window.location.href = 'guide.html';
    } else {
      // 密码错误
      document.getElementById('error').style.display = 'block';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  });
}

// 回车键提交
document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    checkPassword();
  }
});
</script>
</body>
</html>
